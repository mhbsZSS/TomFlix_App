# 1. Banco de Dados: Totalmente interno
  db:
    image: mariadb:latest
    container_name: tomflix_db
    # NÃO coloque "ports:" aqui

  # 2. Serviço de Autenticação: "sem porta publicada"
  auth-service:
    build: ./auth_service
    container_name: tomflix_auth_service
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_NAME=tomflix_db
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    depends_on:
      - db

  # 3. Catálogo (App): O ÚNICO ponto de entrada público
  app:
    build: .
    container_name: tomflix_app
    ports:
      - "8221:8000" 
    environment:
      - AUTH_URL=http://auth-service:3000
    depends_on:
      - auth-service
      - db
